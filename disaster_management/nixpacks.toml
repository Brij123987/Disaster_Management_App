[phases.setup]
nixPkgs = [
  "python310",
  "unixODBC",  # for pyodbc
  "pkg-config", 
  "gcc",        # needed for wheel builds
  "gfortran",   # For scipy compilation
  "meson"       # For building scipy
]

[phases.install]
cmds = [
  "python3.10 -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --upgrade pip",
  "pip install --only-binary :all: -r requirements.txt"  # Force binary wheels
]

[start]
cmd = ". /opt/venv/bin/activate && gunicorn disaster_management.wsgi:application"
